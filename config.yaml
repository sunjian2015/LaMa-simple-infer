device: "cpu" #"cuda:0"
model_path: "generator_weight.pt"
modulo: 8
generator:
  input_nc: 4
  output_nc: 3
  ngf: 64
  n_downsampling: 3
  n_blocks: 18
  add_out_act: "sigmoid"
  init_conv_kwargs:
    ratio_gin: 0
    ratio_gout: 0
    enable_lfu: false
  downsample_conv_kwargs:
    ratio_gin: 0 #${generator.init_conv_kwargs.ratio_gout}
    ratio_gout: 0 #${generator.downsample_conv_kwargs.ratio_gin}
    enable_lfu: false
  resnet_conv_kwargs:
    ratio_gin: 0.75
    ratio_gout: 0.75 #${generator.resnet_conv_kwargs.ratio_gin}
    enable_lfu: false
refine: False # refiner will only run if this is True
refiner:
  n_iters: 15 # number of iterations of refinement for each scale
  lr: 0.002 # learning rate
  min_side: 512 # all sides of image on all scales should be >= min_side / sqrt(2)
  max_scales: 3 # max number of downscaling scales for the image-mask pyramid
  px_budget: 1800000 # pixels budget. Any image will be resized to satisfy height*width <= px_budget